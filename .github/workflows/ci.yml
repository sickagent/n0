name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            **/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
      - name: Verify generated protobuf contracts
        run: |
          make proto
          git diff --exit-code -- proto/gen/go
      - name: Unit tests with race detector
        run: make test-race
      - name: Vet
        run: |
          for module in pkg/shared proto/gen/go services/agent-gateway services/meta-service services/query-engine services/connection-manager; do
            (cd "$module" && go vet ./...)
          done

  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
