version: 2
updates:
  - package-ecosystem: gomod
    directory: /pkg/shared
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /proto/gen/go
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /services/agent-gateway
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /services/connection-manager
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /services/meta-service
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /services/query-engine
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /tests/e2e
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /services/web-admin
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /services/agent-gateway
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/connection-manager
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/meta-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/query-engine
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/web-admin
    schedule:
      interval: weekly
