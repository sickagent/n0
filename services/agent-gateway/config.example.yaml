# Reference configuration for Kubernetes.
# The binary reads environment variables or flags, not YAML directly.
# Mount this file only as documentation, or copy its values to a ConfigMap.
APP_NAME: "agent-gateway"
ENVIRONMENT: "production"
LOG_LEVEL: "info"
NATS_URL: "nats://nats.n0.svc.cluster.local:4222"
GRPC_ADDR: ":8080"
HTTP_ADDR: ":8081"
META_SERVICE_ADDR: "meta-service.n0.svc.cluster.local:8080"
META_SERVICE_HTTP_URL: "http://meta-service.n0.svc.cluster.local:8081"
QUERY_ENGINE_ADDR: "query-engine.n0.svc.cluster.local:8080"
CONNECTION_MANAGER_ADDR: "connection-manager.n0.svc.cluster.local:8080"
JWT_EXPIRY_HOURS: "8"
CORS_ALLOWED_ORIGINS: "https://admin.example.com"
# JWT_SECRET must come from a Kubernetes Secret.
